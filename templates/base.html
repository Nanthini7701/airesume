<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #020617;
            --primary: #22c55e;
            --text-light: #e5e7eb;
            --text-muted: #94a3b8;
            --border-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020617, #020617);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- HEADER ---------- */
        header {
            background: rgba(2, 6, 23, 0.95);
            border-bottom: 1px solid var(--border-dark);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary);
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: var(--text-light);
            font-size: 14px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* ---------- MAIN CONTENT ---------- */
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 1100px;
            margin: auto;
            width: 100%;
        }

        .card {
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid var(--border-dark);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- BUTTON ---------- */
        button {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            padding: 12px 24px;
            color: #020617;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #020617;
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            color: var(--text-light);
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: rgba(2, 6, 23, 0.95);
            border-top: 1px solid var(--border-dark);
            padding: 18px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        footer span {
            color: var(--primary);
            font-weight: 500;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin-left: 10px;
            }

            main {
                padding: 20px 14px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">AI Resume System</div>
    <nav>
        <a href="/">Home</a>
        <a href="/candidate/">Candidate</a>
        <a href="/recruiter/">Recruiter</a>
        <a href="/logout/">Logout</a>
    </nav>
</header>

<!-- MAIN -->
<main>
    <div class="card">
        {% block content %}
        {% endblock %}
    </div>
</main>

<!-- FOOTER -->
<footer>
    © {{ year|default:"2025" }} <span>AI Resume Screening & Job Recommendation System</span>  
    <br>
    Built with ❤️ using Django
</footer>

</body>
</html>
