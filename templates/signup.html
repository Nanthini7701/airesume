{% extends 'base.html' %}
{% block content %}

<div style="
    max-width:420px;
    margin:40px auto;
">

    <h2 style="text-align:center;margin-bottom:10px;">
        Create Account
    </h2>

    <p style="
        text-align:center;
        font-size:14px;
        color:#94a3b8;
        margin-bottom:24px;
    ">
        Join our AI-powered Resume Screening platform
    </p>

    <form method="post" class="card">
        {% csrf_token %}

        <!-- Render form fields -->
        {% for field in form %}
            <div style="margin-bottom:16px;">
                <label style="
                    font-size:13px;
                    color:#94a3b8;
                ">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <div style="color:#ef4444;font-size:12px;margin-top:4px;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" style="width:100%;margin-top:10px;">
            Sign Up
        </button>
    </form>

    <p style="
        text-align:center;
        font-size:13px;
        color:#94a3b8;
        margin-top:18px;
    ">
        Already have an account?
        <a href="/" style="color:#22c55e;font-weight:500;">Login</a>
    </p>

</div>

{% endblock %}
